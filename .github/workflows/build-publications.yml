name: Build publications

# Сборка страниц «Публикации». Независима от сборки терминов и связок:
# только читает термины и пишет в share/terms/publications/pages и sitemap_publications.xml.
on:
  push:
    branches: [main]
    paths:
      - 'share/terms/publications/json/**'
      - 'share/terms/publications/html/**'
      - 'share/terms/publications/covers/**'
      - 'share/terms/publications/template/**'
      - 'share/terms/publications/css/**'
      - '.github/scripts/build-publications.js'
      - '.github/scripts/test-publications.js'
  # После каждой сборки терминов: перепроверка ссылок на термины в статьях
  workflow_run:
    workflows: ['Build terms']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Сборки идут по очереди, без отмены уже идущих
concurrency:
  group: build-publications
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node .github/scripts/test-publications.js

      # При ошибках в публикациях шаг не останавливает job: валидные публикации всё равно
      # собираются, а красный статус ставится последним шагом.
      - name: Build publications
        id: build
        continue-on-error: true
        run: node .github/scripts/build-publications.js

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add share/terms/publications/pages/ share/terms/publications/sitemap_publications.xml
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "Автосборка публикаций [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Fail if publications have errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "В публикациях найдены ошибки (см. шаг Build publications). Публикации с ошибками не созданы."
          exit 1
